basic:
  checkpoint: null
  headless: false
  device: "cuda:0"
  max_iterations: 20000
  seed: 42
  description: "Unitree G1 13-DoF soccer task"

env:
  # Distal arm collision proxies are omitted to support this single-GPU batch.
  num_envs: 8192
  num_observations: 52
  num_critic_obs: 64
  num_privileged_obs: 14
  num_amp_obs: 41
  num_actions: 13
  env_spacing: 1.

motion:
  motion_path: "data/g1"
  dof_start_index: 0
  reference_state_init: true
  replay_buffer_size: 1000000

runner:
  num_stack: 50
  horizon_length: 24
  save_path: "."
  save_interval: 100
  use_wandb: false

viewer:
  pos: [3., -3., 2.]
  lookat: [0., 0., 0.]
  record_video: false
  record_interval: 5.
  record_env_idx: 0

algorithm:
  num_learning_epochs: 5
  num_mini_batches: 4
  history_embedding_dim: 64
  learning_rate: 1.e-3
  discriminator_lr: 1.e-4
  gamma: 0.995
  lam: 0.95
  bound_coef: 100.0
  reconstruction_coef: 1.0
  entropy_coef: -0.01
  symmetric_coef: 10.
  amp_coef: 1.0
  grad_pen_coef: 5.0
  desired_kl: 0.01
  advantage_coef: [2.0, 1.0]
  amp_reward_coef: 0.3

sim:
  dt: 0.002
  substeps: 1
  up_axis: "z"
  gravity: [0.0, 0.0, -9.81]
  physics_engine: "physx"
  physx:
    num_threads: 4
    solver_type: 1
    num_position_iterations: 4
    num_velocity_iterations: 1
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 100.0
    default_buffer_size_multiplier: 5.0
    max_gpu_contact_pairs: 8388608
    num_subscenes: 4
    contact_collection: 1

asset:
  file: "resources/g1_description/g1_13dof.urdf"
  mujoco_file: "resources/g1_description/g1_soccer.xml"
  name: "G1"
  base_name: "pelvis"
  head_name: "waist_yaw_link"
  foot_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
  dof_names:
    - left_hip_pitch_joint
    - left_hip_roll_joint
    - left_hip_yaw_joint
    - left_knee_joint
    - left_ankle_pitch_joint
    - left_ankle_roll_joint
    - right_hip_pitch_joint
    - right_hip_roll_joint
    - right_hip_yaw_joint
    - right_knee_joint
    - right_ankle_pitch_joint
    - right_ankle_roll_joint
    - waist_yaw_joint
  disable_gravity: false
  default_dof_drive_mode: 3
  collapse_fixed_joints: true
  fix_base_link: false
  self_collisions: 1
  replace_cylinder_with_capsule: true
  flip_visual_attachments: false
  density: 0.001
  angular_damping: 0.
  linear_damping: 0.
  max_angular_velocity: 1000.
  max_linear_velocity: 1000.
  armature: 0.01
  thickness: 0.01
  feet_edge_pos:
    - [ 0.12,  0.03, -0.03]
    - [ 0.12, -0.03, -0.03]
    - [-0.05,  0.025, -0.03]
    - [-0.05, -0.025, -0.03]
  camera_pos: [0.05366, 0.01753, 0.47387]
  # Camera offset is expressed from the surviving waist_yaw_link after fixed joints collapse.
  # A 25 degree downward tilt keeps balls visible across the field.
  camera_rot: [0., 0.21643961393810288, 0., 0.9762960071199334]
  camera_fov: [87, 58]

init_state:
  pos: [0.0, 0.0, 0.8]
  rot: [0.0, 0.0, 0.0, 1.0]
  lin_vel: [0.0, 0.0, 0.0]
  ang_vel: [0.0, 0.0, 0.0]
  default_joint_angles:
    left_hip_pitch_joint: -0.2
    left_knee_joint: 0.4
    left_ankle_pitch_joint: -0.2
    right_hip_pitch_joint: -0.2
    right_knee_joint: 0.4
    right_ankle_pitch_joint: -0.2
    default: 0.

control:
  stiffness:
    hip_yaw: 150.
    hip_roll: 150.
    hip_pitch: 150.
    knee: 200.
    ankle: 60.
    waist: 150.
  damping:
    hip_yaw: 4.
    hip_roll: 4.
    hip_pitch: 4.
    knee: 5.
    ankle: 2.
    waist: 4.
  # Radians per action, in asset.dof_names order. Paired joints share scales.
  action_scale: [1.3, 1.1, 1.15, 1.0, 0.6, 0.4,
                 1.3, 1.1, 1.15, 1.0, 0.6, 0.4,
                 0.65]
  decimation: 10

terrain:
  type: "trimesh"
  static_friction: 0.5
  dynamic_friction: 0.5
  restitution: 0.
  terrain_length: 20.
  terrain_width: 20.
  border_size: 20.
  num_terrains: 8
  terrain_proportions: [0.0, 0.0, 0.5, 0.5]
  slope: 0.1
  random_height: 0.05
  discrete_height: 0.02
  horizontal_scale: 0.1
  vertical_scale: 0.005
  slope_threshold: 2.0

normalization:
  gravity: 1.0
  lin_vel: 1.0
  ang_vel: 1.0
  dof_pos: 1.0
  dof_vel: 0.1
  push_force: 0.1
  push_torque: 0.5
  clip_actions: 1.

noise:
  gravity: {range: [0., 0.01], operation: "additive", distribution: "gaussian"}
  lin_vel: {range: [0., 0.05], operation: "additive", distribution: "gaussian"}
  ang_vel: {range: [0., 0.1], operation: "additive", distribution: "gaussian"}
  dof_pos: {range: [0., 0.01], operation: "additive", distribution: "gaussian"}
  dof_vel: {range: [0., 0.1], operation: "additive", distribution: "gaussian"}
  height: {range: [0., 0.02], operation: "additive", distribution: "gaussian"}
  goal_pos: {range: [0., 0.5], operation: "additive", distribution: "gaussian"}
  base_yaw: {range: [0., 0.1], operation: "additive", distribution: "gaussian"}

randomization:
  init_dof_pos: {range: [0., 0.05], operation: "additive", distribution: "gaussian"}
  init_base_pos_xy: {range: [-1., 1.], operation: "additive", distribution: "uniform"}
  init_base_lin_vel_xy: {range: [0., 0.1], operation: "additive", distribution: "gaussian"}
  kick_interval_s: 2.
  kick_lin_vel: {range: [0., 0.1], operation: "additive", distribution: "gaussian"}
  kick_ang_vel: {range: [0., 0.02], operation: "additive", distribution: "gaussian"}
  push_interval_s: 5.
  push_duration_s: 1.
  push_force: {range: [0., 20.], operation: "additive", distribution: "gaussian"}
  push_torque: {range: [0., 2.], operation: "additive", distribution: "gaussian"}
  reset_ball_prob: 1.e-3
  kick_ball_prob: 5.e-3
  kick_ball_vel: 0.5
  ball_delay_step: {range: [6, 1], operation: "additive", distribution: "gaussian"}
  dof_offset: {range: [-0.05, 0.05], operation: "additive", distribution: "uniform"}
  dof_stiffness: {range: [0.95, 1.05], operation: "scaling", distribution: "uniform"}
  dof_damping: {range: [0.95, 1.05], operation: "scaling", distribution: "uniform"}
  friction: {range: [0.0, 1.0], operation: "additive", distribution: "uniform"}
  compliance: {range: [0.5, 1.5], operation: "additive", distribution: "uniform"}
  restitution: {range: [0.0, 1.0], operation: "additive", distribution: "uniform"}
  base_com: {range: [-0.05, 0.05], operation: "additive", distribution: "uniform"}
  base_mass: {range: [0.95, 1.05], operation: "scaling", distribution: "uniform"}
  other_com: {range: [-0.005, 0.005], operation: "additive", distribution: "uniform"}
  other_mass: {range: [0.98, 1.02], operation: "scaling", distribution: "uniform"}
  ball_mass: {range: [0.4, 0.45], operation: "additive", distribution: "uniform"}
  ball_restitution: {range: [0.0, 1.0], operation: "additive", distribution: "uniform"}
  ball_friction: {range: [0.1, 0.3], operation: "additive", distribution: "uniform"}

rewards:
  scales:
    survival: 3.
    termination: -1000.
    pos_still: -100.
    goal: 15.
    ball_distance: 50.
    goal_distance: 500.
    kick_ball: -20.
    side_kick_ball: 20.
    face_ball_pitch: -0.5
    face_ball_yaw: -0.5
    root_acc: -1.e-3
    action_rate: -1.
    dof_pos_limits: -100.
    collision: -100.
    feet_min_distance: -5.
  rew_group_item: ["goal", "ball_distance", "goal_distance"]
  episode_length_s: 60.
  terminate_height: 0.55
  terminate_vel: 50.
  terminate_contacts_on: []
  penalize_contacts_on: ["pelvis", "hip", "knee", "waist_yaw"]
  only_positive_rewards: false
  soft_dof_pos_limit: 0.9
  max_kick_vel: 2.0
  feet_min_distance: 0.1
  penalize_pos: 0.7
  penalize_yaw: 1.0
  penalize_pos_distance: 1.0

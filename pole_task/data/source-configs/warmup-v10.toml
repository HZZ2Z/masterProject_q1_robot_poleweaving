# Stage 7.12 course warmup v10: identical to warmup-v9 (v7 contact-consistent
# reference, frozen actor, robot-anchored goals, rel-v3 warm start) except the
# collection physics is deterministic (randomize = false), so the warmup is
# fitted to the same nominal physics distribution that the pre-registered
# admission diagnostic measures. The randomized diagnostic is reported
# alongside but is not a gate. Pre-registered in
# runs/q1-pole-weaving/stage-7-7/course-warmup-v10-protocol.json.
[train]
robot_xml = "../../../expert/resources/q1_description/source_task_7_7/q1_v3_mc.xml"
motion_dir = "../references"
output_dir = "../../../logs/q1-pole-weaving/source-course-warmup-v10"
course_config = "../course/geometry.toml"
course_catalog = "../course/source-catalog-v7.toml"
motion_pattern = "*.npz"
max_motions = 0
motion_selection = "first"
motion_seed = 0
motion_memory_gb = 8.0
motion_storage = "device"
device = "cuda:0"
num_envs = 512
iterations = 2000
max_env_steps = 0
eval_interval_env_steps = 0
eval_patience = 0
eval_min_delta = 0.0
replay_steps = 4000
model_batch_size = 512
policy_batch_size = 512
model_batches = 10
critic_epochs = 5
critic_minibatches = 4
learning_rate = 0.0001
actor_learning_rate = 1e-05
actor_warmup_updates = 2000
action_scale = 0.5
use_tn = true
action_noise = 0.0
clean_policy_actions = true
action_lag = false
modeled_action_delay = true
network_activation = "silu"
dynamics_representation = "heading"
goal_representation = "robot"
normalize_policy_objective = true
normalize_model_objective = true
randomize = false
small_networks = false
save_interval = 100
initial_save_iteration = 1
seed = 20261071
profile_iterations = 0
profile_every = 0
compile_networks = false
compile_collection = false
fuse_model_loss = false
cache_reference_heads = false
cache_goals = false
capture_reset = false
capture_imagination = false
compile_critic = false
fused_optimizers = false
physics_timestep = 0.002
q1_reward_scaling = true
reward_arm_joint_weight = 0.05
reward_arm_pd_target_weight = 0.0
reward_arm_error_std = 0.8
reward_pole_clearance_weight = 0.0
reward_pole_safe_clearance_m = 0.25
runtime_checks = "per_update"
collective_timeout_seconds = 300
warm_start = "../runs/q1-pole-weaving/stage-7-7/turn-base-rel-v3/checkpoint_12000.pt"
warm_start_progress = false
checkpoint_replay = false
resume_replay = true

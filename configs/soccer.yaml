# Q1 soccer training; no run starts without --start-training.
device: cuda:0
num_envs: 1024
iterations: 20000
seed: 42
collect_steps: 64
warmup_steps: 256
replay_steps: 128
model_sequence: 8
model_batches: 8
batch_size: 256
width: 256
model_width: 512
validation_horizon: 8
imagination_horizon: 8
model_action_response_cosine: 0.8
model_action_response_relative_error: 0.4
actor_start_iteration: 50
learning_rate: 0.0002
exploration_std: 0.025
exploration_progress_scale: 0.0
save_interval: 100
output: logs/q1_supermimic
wandb_entity: mohismlab-robotics
wandb_project: q1-humanoid-kick-SuperMimic

# Leave room for PPO: ~9.6 GiB Torch cap, plus bounded Warp allocations.
torch_memory_fraction: 0.30

evaluation_interval: 10
evaluation_envs: 64
evaluation_seeds: [104729, 204731, 304737]
evaluation_steps: 300
model_max_mse: 1.0
model_max_ratio: 0.80
model_max_height_mae: 0.01
model_max_joint_rmse: 0.025
model_max_velocity_rmse: 0.5

policy_objective: analytic_model_actor_real_gae_critic
gamma: 0.995
gae_lambda: 0.98
critic_epochs: 4
policy_max_kl: 0.01

# Save and stop instead of silently collecting with a frozen/repeatedly rolled-back policy.
max_policy_stall_iterations: 200

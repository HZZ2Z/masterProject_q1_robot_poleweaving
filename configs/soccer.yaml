# Q1 soccer training; no run starts without --start-training.
device: cuda:0
num_envs: 1024
iterations: 20000
seed: 42
collect_steps: 64
warmup_steps: 256
replay_steps: 512
model_sequence: 8
model_batches: 8
batch_size: 256
width: 256
validation_horizon: 4
actor_start_iteration: 100
learning_rate: 0.00005
exploration_std: 0.015
exploration_progress_scale: 0.0
save_interval: 100
output: logs/q1_supermimic
wandb_entity: mohismlab-robotics
wandb_project: q1-humanoid-kick-SuperMimic

# Leave room for PPO: ~9.6 GiB Torch cap, plus bounded Warp allocations.
torch_memory_fraction: 0.30

evaluation_interval: 50
evaluation_envs: 32
evaluation_steps: 300
model_max_mse: 1.0
model_max_ratio: 0.80
model_max_height_mae: 0.01
model_max_joint_rmse: 0.025
model_max_velocity_rmse: 0.5

policy_objective: on_policy_gae_vpg_kl_backtracking
gamma: 0.995
gae_lambda: 0.98
critic_epochs: 4
critic_warmup_iterations: 20
policy_max_kl: 0.005
